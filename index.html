<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, height=device-height, target-densitydpi=device-dpi, interactive-widget=resizes-content" />
    <title>SI Presensi - Pulsating Digital Enterprise</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="manifest" href="./manifest.json" />
    <meta name="theme-color" content="#0B0C10" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%238E2DE2'/><text x='50' y='68' font-size='50' text-anchor='middle' fill='white' font-family='serif' font-weight='bold'>SP</text></svg>" />

    <style>
      html, body { margin: 0; padding: 0; background: #0B0C10; min-height: 100vh; }
      .app-loading {
        position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        background: #0B0C10; z-index: 99999; transition: opacity 0.4s ease;
      }
      .app-loading.fade { opacity: 0; pointer-events: none; }
      .app-loading-inner {
        width: 64px; height: 64px; border-radius: 24px;
        background: linear-gradient(135deg, #8E2DE2, #00C9FF); padding: 2px;
        box-shadow: 0 0 40px rgba(142,45,226,0.3);
        animation: pulse-loader 2s ease-in-out infinite;
      }
      .app-loading-inner div {
        width: 100%; height: 100%; background: #0B0C10; border-radius: 22px;
        display: flex; align-items: center; justify-content: center;
        font-family: 'Playfair Display', serif; font-weight: 700;
        font-size: 16px; color: #fff;
      }
      @keyframes pulse-loader {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.05); opacity: 0.8; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="app-loading" id="appLoader">
        <div class="app-loading-inner"><div>SP</div></div>
      </div>
    </div>
    <script>
      window.addEventListener('load', () => {
        setTimeout(() => {
          const el = document.getElementById('appLoader');
          if (el) el.classList.add('fade');
        }, 200);
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
