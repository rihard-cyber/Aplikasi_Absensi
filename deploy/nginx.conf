# =============================================================================
# NGINX CONFIG — SI PRESENSI PRO MAX PRODUCTION
# =============================================================================
# Cara pakai:
#   1. Build: npm run build
#   2. Copy dist/ ke server: scp -r dist/ root@server:/var/www/sipresensi/
#   3. Copy config: scp deploy/nginx.conf root@server:/etc/nginx/sites-available/sipresensi
#   4. Enable: ln -s /etc/nginx/sites-available/sipresensi /etc/nginx/sites-enabled/
#   5. Test: nginx -t
#   6. Reload: systemctl reload nginx
# =============================================================================

server {
    listen 80;
    server_name sipresensi.com www.sipresensi.com;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name sipresensi.com www.sipresensi.com;

    # SSL — ganti dengan path certbot/letsencrypt Anda
    ssl_certificate /etc/letsencrypt/live/sipresensi.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sipresensi.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /var/www/sipresensi/dist;
    index index.html;

    # =====================================================================
    # 1. SEO: Landing page untuk search engine
    #    Saat Google/Bot akses / — mereka dapat landing.html (static HTML)
    #    Saat user akses / — mereka juga dapat landing.html dulu
    # =====================================================================
    location = / {
        try_files /landing.html /index.html;
    }

    # =====================================================================
    # 2. React App (HashRouter)
    #    Semua route dengan hash (#/) di-handle oleh React
    #    Tapi untuk direct URL /app, /login, dll — serve index.html
    # =====================================================================
    location / {
        try_files $uri $uri/ /index.html;
    }

    # =====================================================================
    # 3. Static assets (cache lama)
    # =====================================================================
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # =====================================================================
    # 4. Service Worker
    # =====================================================================
    location /sw.js {
        add_header Cache-Control "no-cache";
    }

    # =====================================================================
    # 5. Security headers
    # =====================================================================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()";

    # =====================================================================
    # 6. Gzip compression
    # =====================================================================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript image/svg+xml;

    # =====================================================================
    # 7. Logging
    # =====================================================================
    access_log /var/log/nginx/sipresensi_access.log;
    error_log /var/log/nginx/sipresensi_error.log;
}
